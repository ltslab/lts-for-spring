name: release

# Run by hand from main: build the train, sign the zip, and draft a GitHub release. With `central`, also
# upload the modules that Maven Central lacks (USER_MANAGED); publishing the draft then publishes them.
on:
  workflow_dispatch:
    inputs:
      central:
        description: Also publish the train on Maven Central (modules, BOM, extension, plugin)
        type: boolean
        default: false
      drop:
        description: Instead of building, drop this unpublished Central deployment (its ID)
        required: false
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.drop == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags pick each project's version
      - uses: ./.github/actions/setup
      - name: Check manifest, CVEs, and patches
        run: python scripts/verify.py
      - name: Build the zip
        run: |
          python scripts/release.py build
          python scripts/release.py boms
          python scripts/release.py samples
          python scripts/release.py zip
      - name: Build the Maven Central train
        if: inputs.central
        run: |
          python scripts/release.py central-build
          python scripts/release.py bom
          python scripts/release.py compat
          python scripts/release.py central-samples
          python scripts/release.py bundle
      - uses: actions/upload-artifact@v7
        with:
          name: train
          path: |
            dist/*.zip
            dist/bundle
          retention-days: 7

  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write  # the draft release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags pick each project's version
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: train
          path: dist
      # The CI key is a signing subkey of the ltslab key; the primary key never leaves the maintainer.
      - name: Sign
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          gpg --batch --quiet --import <<< "$GPG_SIGNING_KEY"
          python scripts/release.py sign
      - name: Upload to the Central Portal and wait for validation
        if: inputs.central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          python scripts/release.py upload
          python scripts/release.py central-samples staging
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import sys; sys.path.insert(0, "scripts"); import release; print(release.BOM_VERSION)')
          deployment=$(cat dist/deployment.txt 2>/dev/null || true)
          python scripts/release.py notes $deployment > dist/notes.md
          gh release create "$version" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$version" --notes-file dist/notes.md "dist/lts-for-spring-$version.zip" \
            "dist/lts-for-spring-$version.zip.asc"
          echo "Drafted release $version ${deployment:+for deployment $deployment}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'release' && contains(github.event.release.body, 'Maven Central deployment:')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags pick each project's version
      - uses: ./.github/actions/setup
      - name: Publish the deployment named in the release notes
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          version=$(python -c 'import sys; sys.path.insert(0, "scripts"); import release; print(release.BOM_VERSION)')
          [ "$TAG" = "$version" ] || { echo "error: tag $TAG is not the train version $version"; exit 1; }
          deployment=$(grep -oE 'Maven Central deployment: `[0-9a-f-]{36}`' <<< "$NOTES" | grep -oE '[0-9a-f-]{36}')
          python scripts/release.py publish "$deployment"
      # Maven Central can take a few minutes to serve a new deployment.
      - name: Resolve the modules from Maven Central
        run: |
          for attempt in 1 2 3 4 5 6; do python scripts/release.py central-samples central && exit 0; sleep 120; done
          exit 1

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.drop != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags pick each project's version
      - uses: ./.github/actions/setup
      - name: Drop the deployment
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT: ${{ inputs.drop }}
        run: python scripts/release.py drop "$DEPLOYMENT"
