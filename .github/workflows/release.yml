name: release

# Run by hand from main: build the train, sign the zip, upload the modules that Maven Central lacks as
# USER_MANAGED, wait for validation, publish the deployment, and draft a GitHub release. Publishing the draft
# does not publish Central; the central-check workflow resolves the modules separately.
on:
  workflow_dispatch:
    inputs:
      central:
        description: Also publish the train on Maven Central (modules, BOM, extension, plugin)
        type: boolean
        default: false
      drop:
        description: Instead of building, drop this validated but unpublished Central deployment (its ID)
        required: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.drop == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags pick each project's version
      - uses: ./.github/actions/setup
      - name: Check manifest, CVEs, and patches
        run: python scripts/verify.py
      - name: Build the zip
        run: |
          python scripts/release.py build
          python scripts/release.py boms
          python scripts/release.py samples
          python scripts/release.py classes
          python scripts/release.py zip
      - name: Build the Maven Central train
        if: inputs.central
        run: |
          python scripts/release.py central-build
          python scripts/release.py bom
          python scripts/release.py compat
          python scripts/release.py central-samples
          python scripts/release.py bundle
      - uses: actions/upload-artifact@v7
        with:
          name: train
          path: |
            dist/*.zip
            dist/bundle
          retention-days: 7

  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write  # the draft release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags pick each project's version
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: train
          path: dist
      # The CI key is a signing subkey of the ltslab key; the primary key never leaves the maintainer.
      - name: Sign
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          gpg --batch --quiet --import <<< "$GPG_SIGNING_KEY"
          python scripts/release.py sign
      - name: Upload to the Central Portal and wait for validation
        if: inputs.central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          python scripts/release.py upload
          python scripts/release.py central-samples staging
      - name: Publish the validated deployment
        if: inputs.central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: python scripts/release.py publish "$(cat dist/deployment.txt)"
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import sys; sys.path.insert(0, "scripts"); import release; print(release.BOM_VERSION)')
          deployment=$(cat dist/deployment.txt 2>/dev/null || true)
          python scripts/release.py notes $deployment > dist/notes.md
          gh release create "$version" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$version" --notes-file dist/notes.md "dist/lts-for-spring-$version.zip" \
            "dist/lts-for-spring-$version.zip.asc"
          echo "Drafted release $version ${deployment:+for deployment $deployment}" >> "$GITHUB_STEP_SUMMARY"

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.drop != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags pick each project's version
      - uses: ./.github/actions/setup
      - name: Drop the deployment
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT: ${{ inputs.drop }}
        run: python scripts/release.py drop "$DEPLOYMENT"
