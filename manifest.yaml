# Spring Boot BOM properties that ltslab overrides to pick up fixed third-party releases.
# Spring Boot's BOM with newer third-party versions; CONTRIBUTING.md "Dependency upgrades" has the rules.
# scripts/dependencies.py applies them and writes the chosen versions to cves/dependencies.json.
bom:
  lines:  # newer lines, taken only to fix a CVE and only without public API breaks
    commons-lang3.version: "3.18"
    log4j2.version: "2.25"
  rejected:  # CVEs fixed only on a newer line that breaks public API, or not on Maven Central
    httpclient5.version: "5.6 removes public classes and constructors in org.apache.hc.client5.http.impl"
    httpcore5.version: "5.4 removes public constructors in org.apache.hc.core5.http.impl.bootstrap"
    rabbit-amqp-client.version: "5.31 and later make TrustEverythingTrustManager non-public"
    opentelemetry.version: "1.62 changes the superclass of a public class in opentelemetry-sdk-extension-jaeger-remote-sampler"
    activemq.version: "6.2 removes public methods and classes; the fixed 6.1.9 is not on Maven Central"
    artemis.version: "2.53 moves every artifact to the org.apache.artemis group"
    hazelcast.version: "5.7 removes public constructors, fields, and methods"
    r2dbc-mariadb.version: "1.4 removes public constructors and an interface"
    derby.version: "the fixed 10.16.1.2 is not on Maven Central, and newer lines need a newer Java"
  reviewed:  # changes to APIs that Spring uses, checked by hand
    "CONSTRUCTOR_LESS_ACCESSIBLE org.apache.catalina.webresources.AbstractResourceSet#AbstractResourceSet": "now protected; Spring Boot calls it only from subclasses"
